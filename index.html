<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boks">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Boks + Bacak</title>
<style>
:root{--bg:#0b0b0c;--card:#151517;--card2:#1f1f23;--line:#2b2b30;--tx:#f4f4f5;--mut:#9b9ba3;--red:#ef2b2d;--red2:#33131a;--grn:#22c55e;--grn2:#0e2617;--blu:#3b82f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:0 env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 110px) env(safe-area-inset-left)}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:rgba(11,11,12,.95);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-size:24px;margin:0;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.pct{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--card2);border-radius:9px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:9px;transition:width .3s}
.weeks{display:flex;gap:6px;margin-top:12px}
.weeks button{flex:1;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-weight:650;font-size:15px}
.weeks button.on{background:var(--red);border-color:var(--red);color:#fff}
main{padding:4px 14px 0}
.sec{margin-top:22px}
.sh{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.sh h2{font-size:19px;margin:0;letter-spacing:-.01em}
.pill{font-size:12px;color:var(--mut);border:1px solid var(--line);padding:4px 9px;border-radius:99px}
.note{color:var(--mut);font-size:14px;line-height:1.45;margin:6px 2px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px;transition:border-color .2s,background .2s}
.card.done{border-color:#1d4d30;background:linear-gradient(180deg,#0f1f15,var(--card))}
.nm{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.name{font-weight:650;font-size:17px;line-height:1.3}
.ok{color:var(--grn);font-size:13px;font-weight:650;white-space:nowrap}
.meta{color:var(--mut);font-size:14px;margin-top:4px;line-height:1.4}
.meta b{color:var(--tx);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{min-width:48px;height:48px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);font-size:16px;font-weight:650}
.chip.on{background:var(--grn);border-color:var(--grn);color:#04130a}
.run{height:48px;padding:0 20px;border-radius:12px;border:0;background:var(--red);color:#fff;font-size:16px;font-weight:700}
.wrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;background:var(--card2);border-radius:12px;padding:8px 10px 8px 12px}
.wrow .pl{font-size:13px;color:var(--mut)}
.wrow .pl b{color:var(--tx)}
.wrow label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mut)}
.wrow input{width:74px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:17px;font-weight:650;text-align:center}
.vids{margin-top:6px}
.vids a{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#ffb3b3;background:var(--red2);padding:7px 11px;border-radius:99px;text-decoration:none;margin:6px 6px 0 0}
details{margin-top:10px}
summary{font-size:13px;color:var(--mut);list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::before{content:"＋ ";}
details[open] summary::before{content:"－ ";}
.cue{font-size:14px;color:#d0d0d6;line-height:1.5;margin-top:6px}
textarea{width:100%;min-height:76px;margin-top:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-size:15px;padding:10px 12px;resize:vertical}
.actions{display:flex;flex-direction:column;gap:10px;margin:26px 0 8px}
.btn{height:50px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:16px;font-weight:650}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;color:var(--mut)}
.foot{color:var(--mut);font-size:13px;line-height:1.5;margin:14px 2px 0}
/* rest bar */
#rest{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:20;background:#18181b;border:1px solid var(--line);border-radius:18px;padding:12px 12px 12px 16px;display:none;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);overflow:hidden}
#rest.show{display:flex}
#rest .rf{position:absolute;left:0;bottom:0;height:3px;background:var(--grn);width:0}
#rest .rl{font-size:13px;color:var(--mut)}
#rest .rt{font-size:28px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.1}
#rest .sp{flex:1}
#rest button{height:42px;padding:0 13px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-weight:650}
#rest.end .rt{color:var(--grn)}
/* overlay */
#ov{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 20px)}
#ov.show{display:flex}
#ov .on{font-size:17px;font-weight:650;text-align:center;color:var(--mut)}
#ov .ph{margin-top:auto;text-align:center;font-size:30px;font-weight:800;letter-spacing:.08em}
#ov .tm{text-align:center;font-size:min(34vw,180px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1;margin:6px 0}
#ov .rn{text-align:center;font-size:18px;color:var(--mut);font-weight:600}
#ov .pb{height:6px;background:var(--card2);border-radius:9px;margin:22px 0 0;overflow:hidden}
#ov .pb i{display:block;height:100%;width:0;background:var(--tx)}
#ov .oc{margin:18px auto 0;max-width:520px;text-align:center;color:#c9c9cf;font-size:15px;line-height:1.5}
#ov .ob{margin-top:auto;display:flex;gap:10px}
#ov .ob button{flex:1;height:58px;border-radius:15px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:17px;font-weight:700}
#ov[data-ph=work] .ph,#ov[data-ph=work] .tm{color:var(--red)}
#ov[data-ph=work] .pb i{background:var(--red)}
#ov[data-ph=rest] .ph,#ov[data-ph=rest] .tm{color:var(--grn)}
#ov[data-ph=rest] .pb i{background:var(--grn)}
#ov[data-ph=prep] .ph,#ov[data-ph=prep] .tm{color:#f5b301}
#ov[data-ph=done] .ph,#ov[data-ph=done] .tm{color:var(--grn)}
/* modal */
#md{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;padding:16px 12px calc(env(safe-area-inset-bottom) + 16px)}
#md.show{display:flex}
#md .bx{width:100%;max-width:520px;background:#18181b;border:1px solid var(--line);border-radius:20px;padding:18px}
#md h3{margin:0 0 8px;font-size:18px}
#md p{margin:0;color:var(--mut);font-size:15px;line-height:1.45}
#md .mb{display:flex;gap:10px;margin-top:16px}
#md .mb button{flex:1}
</style>
</head>
<body>
<header>
  <div class="top">
    <div><h1>Boks + Bacak</h1><div class="sub" id="sub">İlk ay · haftada 1 seans · ~100 dk</div></div>
    <div class="pct" id="pct">0%</div>
  </div>
  <div class="bar"><i id="pbar"></i></div>
  <div class="weeks" id="weeks"></div>
</header>
<main id="main"></main>

<div id="rest"><div class="rf" id="rf"></div><div><div class="rl" id="rl">Dinlenme</div><div class="rt" id="rt">0:00</div></div><div class="sp"></div><button id="rAdd">+15 sn</button><button id="rSkip">Atla</button></div>

<div id="ov" data-ph="prep">
  <div class="on" id="oN"></div>
  <div class="ph" id="oP">HAZIRLAN</div>
  <div class="tm" id="oT">0:05</div>
  <div class="rn" id="oR"></div>
  <div class="pb"><i id="oB"></i></div>
  <div class="oc" id="oC"></div>
  <div class="ob"><button id="oPause">Duraklat</button><button id="oSkip">Atla</button><button id="oClose">Kapat</button></div>
</div>

<div id="md"><div class="bx"><h3 id="mT"></h3><div id="mB"></div><div class="mb" id="mBtns"></div></div></div>

<script>
const YT=id=>'https://www.youtube.com/watch?v='+id;
const V={
 stance:['Duruş · Skye Nicolson',YT('OOysNE8Wrj8')],
 stance2:['Duruş hataları · Precision Striking',YT('x-yZ0ZPTJnE')],
 step:['Step-drag',YT('dHUutXudf8o')],
 fwdrill:['Footwork drili · T. Jeffries',YT('v0y86288Wt0')],
 jab:['Jab · T. Jeffries',YT('odM78vAS86M')],
 cross:['Cross · T. Jeffries',YT('sK-6Ujp3KYY')],
 onetwo:['1-2 · T. Jeffries',YT('vyTaKpylOcU')],
 def:['Slip, parry, blok',YT('VBtgzyG7kms')],
 parry:['Parry (ağır çekim)',YT('HL261oRyURE')],
 shadow:['Gölge boks · T. Jeffries',YT('i12A6G_LiJo')],
 med:['Rotasyonel atış',YT('PNI1QKiWfiY')],
 sj:['Squat jump iniş',YT('d0p-3x84nj0')],
 lb:['Lateral bound',YT('Rlf8hQ-Jzis')],
 pogo:['Pogo jump',YT('zKqcL6HSTE4')],
 lp:['Leg press · J. Nippard','https://www.youtube.com/shorts/nDh_BlnLCGc'],
 bss:['Bulgarian · Squat University',YT('-4LVK1crLSw')],
 ht:['Hip thrust · B. Contreras',YT('oeua30yIOF4')],
 calf:['Calf raise',YT('SVtg-1loH4c')],
 bext:['Back extension',YT('H8Swl1N-uis')],
 pallof:['Pallof press',YT('SY5lRzBPtM4')],
 mcgill:['McGill Big 3',YT('X_IGvnaPmQU')]
};

function plan(w){
 const early=w<2;
 const yum=[
  {name:'Jab',v:['jab'],r:4,cue:"Ön el düz uzanır, bitişte yumruk içe döner. Omuz çeneyi korur. Aynı yoldan hemen guard'a dön."},
  {name:'Jab + ayak',v:['jab','fwdrill'],r:4,cue:"İleri adımla jab, jab sonra geri çıkış. Yumruk adımla birlikte biter, ayak açılmaz."},
  {name:'Cross ve 1-2',v:['cross','onetwo'],r:5,cue:"Arka topuk döner, kalça ve gövde döner, kol en son gelir. Cross atarken ön el yanakta kalır."},
  {name:'1-2 + parry, slip',v:['onetwo','def','parry'],r:5,cue:"1-2 at. Gelen jab'i açık elle yana it (parry). Dizle ve gövdeyle başı çizgiden çıkar (slip). Hemen tekrar 1-2."}
 ][w];
 const shCue=["Sadece jab + footwork. Yavaş ve temiz, her şey guard'a dönsün.","Jab + hareket. Her jab'den sonra pozisyon değiştir.","1-2 + footwork. Her kombinasyondan sonra guard kontrolü.","1-2, slip, 1-2. Savunmadan sonra hemen karşılık ver."][w];
 return [
  {id:'isn',title:'Isınma',time:'8 dk',items:[
   {id:'ip',kind:'rounds',name:'İp atlama',rounds:1,work:300,rest:0,cue:'Hafif tempoda, ayak ucunda. İp yoksa yerinde hafif sekme.'},
   {id:'mob',kind:'rounds',name:'Mobilite: kol, kalça, gövde çevirme',rounds:1,work:180,rest:0,cue:'Omuz çevirme, kalça çevirme, gövde rotasyonu. Her biri ~1 dk.'}
  ]},
  {id:'pat',title:'Patlayıcı blok',time:'10 dk',note:'Bacaklar tazeyken. Her tekrar maksimum hız. Yorulursan seti bitir, kalite sayıdan önemli.',items:[
   {id:'med',kind:'sets',name:'Med Ball Rotational Wall Throw',sets:3,reps:'5 / yan',rest:60,load:early?'4 kg top':'5 kg top',v:['med'],cue:'Duvara yan dur. Kalçayla başlat, arka ayak döner, topu duvara maksimum hızla fırlat.'},
   {id:'sj',kind:'sets',name:'Squat Jump',sets:3,reps:'5',rest:60,load:'Vücut ağırlığı',v:['sj'],cue:'Hızlı in, patla. Dizi bükerek yumuşak ve sessiz in. Tekrarlar arası 1-2 sn reset.'},
   {id:'lb',kind:'sets',name:'Lateral Bound',sets:3,reps:'5 / yan',rest:60,load:'Vücut ağırlığı',v:['lb'],cue:'Tek ayaktan yana sıçra, karşı ayağa in, 1 sn sabitle.'},
   {id:'pogo',kind:'sets',name:'Pogo Hop',sets:2,reps:'20 sn',rest:45,load:'Vücut ağırlığı',v:['pogo'],cue:'Dizler neredeyse düz, ayak ucunda hızlı ve alçak zıplamalar.'}
  ]},
  {id:'boks',title:'Boks',time:'~42 dk',note:w===1?'Bu haftanın sonunda bir antrenöre formuna baktır.':'Her hafta tek konu. Kendini yandan çekip videoyla karşılaştır.',items:[
   {id:'stance',kind:'rounds',name:'Stance + guard',rounds:[4,2,2,2][w],work:90,rest:30,v:['stance','stance2'],cue:'Ayna önünde. Sağ elliysen sol ayak önde, ayaklar omuz genişliği. Dizler hafif bükük, topuk hafif havada. Eller yanakta, dirsekler gövdede, çene aşağı.'},
   {id:'fw',kind:'rounds',name:'Footwork: step and drag',rounds:[5,4,3,3][w],work:w===0?90:120,rest:30,v:['step','fwdrill'],cue:'Gideceğin yöndeki ayak önce gider, diğeri sürünür. Ayaklar asla çaprazlanmaz, genişlik sabit kalır.'},
   {id:'yum',kind:'rounds',name:yum.name,rounds:yum.r,work:120,rest:30,v:yum.v,cue:yum.cue},
   {id:'sh',kind:'rounds',name:'Gölge boks',rounds:[3,3,3,4][w],work:120,rest:60,v:['shadow'],cue:shCue}
  ]},
  {id:'kuv',title:'Kuvvet bloğu',time:'25-30 dk',note:"Her sette 2 RiR bırak, 0'a gitme. Tüm setler 2 RiR ile bittiyse ertesi hafta artır, bitmediyse aynı kalsın.",items:[
   {id:'lp',kind:'sets',name:'Leg Press',sets:3,reps:'10',rest:90,wt:[80,85,90,95],unit:'kg',v:['lp'],cue:'Ayaklar platformun ortasında, omuz genişliğinde. Bel koltuktan kalkmasın. Dizleri tam kilitleme.'},
   {id:'bss',kind:'sets',name:'Bulgarian Split Squat',sets:2,reps:'8 / bacak',rest:90,wt:[10,10,12,12],unit:'kg × 2',v:['bss'],cue:'Arka ayak bankta. Gövde hafif öne, ön dizle kontrollü in. Zayıf bacakla başla.'},
   {id:'ht',kind:'sets',name:'Barbell Hip Thrust',sets:3,reps:'8',rest:90,wt:[40,42.5,45,47.5],unit:'kg',v:['ht'],cue:'Sırtın üstü bankta, çene göğse yakın, kaburgalar aşağı. Tepede 1 sn kalçayı sık. Belle değil kalçayla kaldır.'},
   {id:'calf',kind:'sets',name:'Standing Calf Raise',sets:2,reps:'15',rest:60,wt:[15,15,17.5,17.5],unit:'kg × 2',v:['calf'],cue:'Tam aşağı in, tepede 1 sn bekle. Sekme yok.'},
   {id:'bext',kind:'sets',name:'45° Back Extension',sets:2,reps:'12',rest:60,wt:[0,0,0,5],unit:'kg plaka',v:['bext'],cue:'2 sn çık, 3 sn in. Hareket kalçadan, bel sabit. Tepede vücut düz bir çizgi olsun, aşırı kavisleme.'},
   {id:'pallof',kind:'sets',name:'Pallof Press',sets:2,reps:'10 / yan',rest:45,wt:[10,10,12.5,12.5],unit:'kg',v:['pallof'],cue:'Kabloya yan dur, kolları göğüsten düz it, 2 sn tut. Gövde dönmesin.'},
   {id:'bird',kind:'sets',name:'Bird Dog',sets:2,reps:'8 / yan',rest:45,load:'Vücut ağırlığı',v:['mcgill'],cue:'Karşı kol ve bacağı uzat, uçta 2 sn bekle. Bel düz, kalça dönmesin.'},
   {id:'sp',kind:'sets',name:'Side Plank',sets:2,reps:[30,35,40,45][w]+' sn / yan',rest:45,load:'Vücut ağırlığı',v:['mcgill'],cue:'Dirsek omuzun altında, vücut tek çizgi, kalça düşmesin.'}
  ]},
  {id:'esn',title:'Esneme',time:'5 dk',items:[
   {id:'esn',kind:'rounds',name:'Esneme: kalça, baldır, omuz',rounds:1,work:300,rest:0,cue:'Her bölge 30-45 sn, zorlamadan.'}
  ]}
 ];
}

const KEY='boks-bacak-v1';
let S={week:0,done:{},wt:{},notes:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>s%60===0?(s/60)+' dk':s+' sn';
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
let ITEMS={};

function weekPct(w){
 let t=0,d=0;
 plan(w).forEach(sec=>sec.items.forEach(it=>{const k=w+':'+it.id;
  if(it.kind==='sets'){t+=it.sets;d+=Math.min((S.done[k]||[]).filter(Boolean).length,it.sets);}
  else{t++;if(S.done[k])d++;}
 }));
 return t?Math.round(100*d/t):0;
}

function render(){
 const w=S.week,P=plan(w);ITEMS={};
 $('weeks').innerHTML=[0,1,2,3].map(i=>`<button class="${i===w?'on':''}" data-w="${i}">H${i+1}${weekPct(i)===100?' ✓':''}</button>`).join('');
 let h='';
 P.forEach(sec=>{
  h+=`<section class="sec"><div class="sh"><h2>${sec.title}</h2><span class="pill">${sec.time}</span></div>`;
  if(sec.note)h+=`<p class="note">${esc(sec.note)}</p>`;
  sec.items.forEach(it=>{
   const k=w+':'+it.id;ITEMS[k]=it;
   let body='',meta='',done=false,ok='';
   if(it.kind==='sets'){
    const a=S.done[k]||[];const c=a.filter(Boolean).length;done=c>=it.sets;
    ok=c?`${Math.min(c,it.sets)}/${it.sets}`:'';
    meta=`<b>${it.sets} × ${esc(it.reps)}</b> · dinlenme ${it.rest} sn`+(it.load?` · ${esc(it.load)}`:'');
    body=`<div class="chips">`+Array.from({length:it.sets},(_,i)=>`<button class="chip ${a[i]?'on':''}" data-act="set" data-k="${k}" data-i="${i}">${a[i]?'✓':'Set '+(i+1)}</button>`).join('')+`</div>`;
    if(it.wt){
     const pv=it.wt[w];const ptxt=pv===0?'Vücut ağırlığı':pv+' '+it.unit;
     const val=S.wt[k]!==undefined?S.wt[k]:(pv===0?'':pv);
     body+=`<div class="wrow"><span class="pl">Plan: <b>${esc(ptxt)}</b></span><label>Bugün <input inputmode="decimal" data-k="${k}" value="${esc(val)}" placeholder="VA"> ${esc(it.unit.replace(' plaka',''))}</label></div>`;
    }
   }else{
    done=!!S.done[k];ok=done?'✓':'';
    meta=it.rounds>1?`<b>${it.rounds} × ${fmt(it.work)}</b> · ara ${it.rest} sn`:`<b>${fmt(it.work)}</b>`;
    body=`<div class="chips"><button class="run" data-act="run" data-k="${k}">▶ Başlat</button><button class="chip ${done?'on':''}" data-act="tog" data-k="${k}">${done?'✓ Tamam':'Tamam'}</button></div>`;
   }
   const vids=(it.v||[]).map(x=>`<a href="${V[x][1]}" target="_blank" rel="noopener">▶ ${esc(V[x][0])}</a>`).join('');
   h+=`<div class="card ${done?'done':''}"><div class="nm"><div class="name">${esc(it.name)}</div><span class="ok">${ok}</span></div><div class="meta">${meta}</div>${body}${vids?`<div class="vids">${vids}</div>`:''}<details><summary>Form ipucu</summary><div class="cue">${esc(it.cue)}</div></details></div>`;
  });
  if(sec.id==='kuv')h+=`<textarea data-note="1" placeholder="Not: hangi sette zorlandın, RiR, ağrı var mı...">${esc((S.notes||{})[w]||'')}</textarea>`;
  h+=`</section>`;
 });
 h+=`<div class="actions"><button class="btn pri" data-act="copy">Haftanın özetini kopyala</button><button class="btn ghost" data-act="reset">Bu haftayı sıfırla</button></div>
 <p class="foot">Haftalar arası ev drili: gölge boks 10 dk, haftada 2-3 kez.<br>Zil sesi için telefon sessizde olmasın. İlerlemen yalnızca bu tarayıcıda saklanır.</p>`;
 $('main').innerHTML=h;
 const p=weekPct(w);$('pct').textContent=p+'%';$('pbar').style.width=p+'%';
 $('sub').textContent=`Hafta ${w+1} / 4 · haftada 1 seans · ~100 dk`;
}

/* audio */
let AC=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(f,d,v){if(!AC)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f||880;g.gain.setValueAtTime(v||.25,t);g.gain.exponentialRampToValueAtTime(.0001,t+(d||.15));o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+(d||.15)+.03);}catch(e){}}
function bell(){beep(660,.45,.35);setTimeout(()=>beep(990,.6,.35),170);}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
let WL=null;
async function wake(){try{if('wakeLock' in navigator)WL=await navigator.wakeLock.request('screen');}catch(e){}}
function unwake(){try{WL&&WL.release();}catch(e){}WL=null;}

/* rest timer */
let R=null;
function startRest(sec){stopRest();if(!sec)return;R={end:Date.now()+sec*1000,total:sec,last:-1};$('rest').classList.add('show');$('rest').classList.remove('end');$('rl').textContent='Dinlenme';R.iv=setInterval(tickRest,200);tickRest();}
function tickRest(){if(!R)return;const left=Math.max(0,Math.ceil((R.end-Date.now())/1000));if(left===R.last)return;R.last=left;$('rt').textContent=mmss(left);$('rf').style.width=(100*(1-left/R.total))+'%';
 if(left<=3&&left>0)beep(880,.12);
 if(left===0){clearInterval(R.iv);bell();buzz([200,100,200]);$('rl').textContent='Sonraki set';$('rest').classList.add('end');const me=R;setTimeout(()=>{if(R===me)stopRest();},5000);}}
function stopRest(){if(R){clearInterval(R.iv);R=null;}$('rest').classList.remove('show','end');}
$('rAdd').onclick=()=>{ac();if(!R)return;if(R.last===0){startRest(15);return;}R.end+=15000;R.total+=15;};
$('rSkip').onclick=stopRest;

/* round timer */
let T=null;
const PH={prep:'HAZIRLAN',work:'ÇALIŞ',rest:'DİNLEN'};
function runRounds(k){
 const it=ITEMS[k];stopRest();
 const ph=[{t:'prep',d:5}];
 for(let r=1;r<=it.rounds;r++){ph.push({t:'work',d:it.work,r});if(r<it.rounds&&it.rest)ph.push({t:'rest',d:it.rest,r:r+1});}
 T={k,it,ph,i:0,end:Date.now()+5000,paused:false,rem:0,last:-1};
 $('oN').textContent=it.name;$('oC').textContent=it.cue;$('oPause').textContent='Duraklat';
 $('oPause').style.display='';$('oSkip').style.display='';
 $('ov').classList.add('show');wake();
 T.iv=setInterval(tickT,200);tickT();
}
function tickT(){if(!T||T.paused)return;const p=T.ph[T.i];const left=Math.max(0,Math.ceil((T.end-Date.now())/1000));
 if(left!==T.last){T.last=left;$('ov').dataset.ph=p.t;$('oP').textContent=PH[p.t];$('oT').textContent=mmss(left);
  $('oR').textContent=T.it.rounds>1?`Round ${p.r||1} / ${T.it.rounds}`:'';
  $('oB').style.width=(100*(1-left/p.d))+'%';
  if(left<=3&&left>0)beep(p.t==='work'?700:880,.12);}
 if(Date.now()>=T.end)nextPh();}
function nextPh(){T.i++;if(T.i>=T.ph.length){finishT();return;}const p=T.ph[T.i];T.end=Date.now()+p.d*1000;T.last=-1;
 if(p.t==='work'){bell();buzz(300);}else{beep(520,.4,.3);buzz([100,80,100]);}tickT();}
function finishT(){clearInterval(T.iv);S.done[T.k]=true;save();bell();setTimeout(bell,700);buzz([300,100,300]);
 $('ov').dataset.ph='done';$('oP').textContent='BİTTİ';$('oT').textContent='✓';$('oR').textContent='';$('oB').style.width='100%';
 $('oPause').style.display='none';$('oSkip').style.display='none';render();}
$('oPause').onclick=()=>{ac();if(!T)return;if(!T.paused){T.rem=T.end-Date.now();T.paused=true;$('oPause').textContent='Devam';}else{T.end=Date.now()+T.rem;T.paused=false;$('oPause').textContent='Duraklat';}};
$('oSkip').onclick=()=>{if(!T||T.i>=T.ph.length)return;if(T.paused){T.paused=false;$('oPause').textContent='Duraklat';}nextPh();};
$('oClose').onclick=()=>{if(T){clearInterval(T.iv);T=null;}$('ov').classList.remove('show');unwake();};

/* modal */
function modal(title,html,btns){$('mT').textContent=title;$('mB').innerHTML=html;$('mBtns').innerHTML='';
 btns.forEach(b=>{const e=document.createElement('button');e.className='btn'+(b.pri?' pri':'');e.textContent=b.t;e.onclick=()=>{$('md').classList.remove('show');b.f&&b.f();};$('mBtns').appendChild(e);});
 $('md').classList.add('show');}

function summary(){
 const w=S.week,P=plan(w),L=[`Hafta ${w+1} özeti`];
 P.forEach(sec=>{
  if(sec.id==='kuv'){L.push('Kuvvet bloğu:');sec.items.forEach(it=>{const k=w+':'+it.id;const c=Math.min((S.done[k]||[]).filter(Boolean).length,it.sets);
   let load='';if(it.wt){const pv=it.wt[w];const v=S.wt[k]!==undefined&&S.wt[k]!==''?S.wt[k]:(pv===0?'VA':pv);load=(v==='VA'?'VA':v+' '+it.unit);}else load=it.load||'';
   L.push(`- ${it.name}: ${it.sets}×${it.reps}, ${load}, ${c}/${it.sets} set`);});}
  else if(sec.id==='boks'||sec.id==='pat'){let t=0,d=0;sec.items.forEach(it=>{const k=w+':'+it.id;if(it.kind==='sets'){t+=it.sets;d+=Math.min((S.done[k]||[]).filter(Boolean).length,it.sets);}else{t++;if(S.done[k])d++;}});L.push(`${sec.title}: ${d}/${t} tamam`);}
 });
 const n=(S.notes||{})[w];if(n)L.push('Not: '+n);
 return L.join('\n');
}

document.addEventListener('click',e=>{
 const wb=e.target.closest('[data-w]');
 if(wb){S.week=+wb.dataset.w;save();render();window.scrollTo({top:0});return;}
 const b=e.target.closest('[data-act]');if(!b)return;ac();
 const k=b.dataset.k,act=b.dataset.act;
 if(act==='set'){const it=ITEMS[k];const a=S.done[k]||[];const i=+b.dataset.i;a[i]=!a[i];S.done[k]=a;save();render();if(a[i])startRest(it.rest);else stopRest();}
 else if(act==='tog'){S.done[k]=!S.done[k];save();render();}
 else if(act==='run'){runRounds(k);}
 else if(act==='copy'){const txt=summary();
  const fallback=()=>{modal('Özeti kopyala','<p>Metni seçip kopyala, sonra bana gönder.</p><textarea id="sumTa" style="min-height:200px">'+esc(txt)+'</textarea>',[{t:'Kapat',pri:true}]);const ta=$('sumTa');if(ta){ta.focus();ta.select();}};
  try{navigator.clipboard.writeText(txt).then(()=>modal('Kopyalandı','<p>Haftanın özeti panoda. Bana yapıştır, bir sonraki haftanın ağırlıklarını ona göre ayarlarım.</p>',[{t:'Tamam',pri:true}])).catch(fallback);}catch(err){fallback();}}
 else if(act==='reset'){const w=S.week;modal(`Hafta ${w+1} sıfırlansın mı?`,'<p>Bu haftanın işaretleri, ağırlıkları ve notu silinir.</p>',[{t:'Vazgeç'},{t:'Sıfırla',pri:true,f:()=>{Object.keys(S.done).forEach(x=>{if(x.startsWith(w+':'))delete S.done[x];});Object.keys(S.wt).forEach(x=>{if(x.startsWith(w+':'))delete S.wt[x];});if(S.notes)delete S.notes[w];save();render();}}]);}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.matches('input[data-k]')){S.wt[t.dataset.k]=t.value.replace(',','.');save();}
 else if(t.matches('textarea[data-note]')){S.notes=S.notes||{};S.notes[S.week]=t.value;save();}
});
$('md').addEventListener('click',e=>{if(e.target===$('md'))$('md').classList.remove('show');});
render();
</script>
</body>
