<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boks">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0b">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Boks + Bacak</title>
<style>
:root{--bg:#0a0a0b;--tx:#f5f3ef;--mut:#8f8b86;--line:rgba(255,255,255,.07);--gold:#d9b97f;--gold2:#a8844a;--red:#e8282e;--grn:#3ccf7a;
--f:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;--d:'Bebas Neue','Inter',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f);-webkit-font-smoothing:antialiased}
body{padding:0 env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 120px) env(safe-area-inset-left);
 background:radial-gradient(120% 60% at 50% -10%,rgba(232,40,46,.28),transparent 60%),radial-gradient(80% 40% at 100% 0%,rgba(217,185,127,.10),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}
/* hero */
.hero{padding:calc(env(safe-area-inset-top) + 22px) 20px 8px}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
.title{font-family:var(--d);font-size:54px;line-height:.9;letter-spacing:.02em;margin:8px 0 0}
.title span{background:linear-gradient(90deg,var(--gold),#f3e3c3,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hrow{display:flex;align-items:center;gap:18px;margin-top:20px;padding:16px;border-radius:22px;background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line);backdrop-filter:blur(8px)}
.ring{position:relative;width:86px;height:86px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-family:var(--d);font-size:30px;line-height:1;letter-spacing:.02em}
.ring .v small{font-size:10px;color:var(--mut);letter-spacing:.1em}
.next{min-width:0}
.next .k{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.next .n{font-size:18px;font-weight:650;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next .s{font-size:13px;color:var(--mut);margin-top:3px}
.stats{display:flex;gap:8px;margin-top:10px}
.stat{flex:1;padding:12px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--d);font-size:24px;letter-spacing:.03em;line-height:1}
.stat span{font-size:11px;color:var(--mut);letter-spacing:.06em}
/* weeks */
nav{position:sticky;top:0;z-index:8;padding:calc(env(safe-area-inset-top) + 8px) 16px 10px;background:linear-gradient(180deg,rgba(10,10,11,.96) 70%,rgba(10,10,11,0));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.weeks{display:flex;gap:6px;padding:5px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.weeks button{flex:1;height:40px;border:0;border-radius:12px;background:transparent;color:var(--mut);font-weight:650;font-size:14px;letter-spacing:.04em;position:relative}
.weeks button.on{background:linear-gradient(135deg,var(--red),#a3141a);color:#fff;box-shadow:0 6px 18px rgba(232,40,46,.35)}
.weeks button i{position:absolute;right:8px;top:7px;width:6px;height:6px;border-radius:50%;background:var(--grn)}
main{padding:0 16px}
/* sections */
.sec{margin-top:26px}
.sh{display:flex;align-items:center;gap:12px}
.ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);color:var(--c);flex:none}
.ic svg{width:21px;height:21px}
.sh .t{flex:1;min-width:0}
.sh .num{font-size:11px;letter-spacing:.2em;color:var(--c);font-weight:700}
.sh h2{margin:1px 0 0;font-family:var(--d);font-size:28px;letter-spacing:.04em;font-weight:400;line-height:1}
.sh .tm{font-size:12px;color:var(--mut);text-align:right}
.sh .tm b{display:block;color:var(--tx);font-size:13px}
.sbar{height:3px;border-radius:9px;background:rgba(255,255,255,.06);margin:12px 0 0;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--c);border-radius:9px;transition:width .4s}
.note{color:var(--mut);font-size:13.5px;line-height:1.5;margin:10px 2px 0}
.card{position:relative;margin-top:12px;padding:16px 16px 14px 18px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));border:1px solid var(--line);overflow:hidden;transition:transform .15s}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--c);opacity:.9}
.card.done{background:linear-gradient(180deg,rgba(60,207,122,.10),rgba(60,207,122,.02));border-color:rgba(60,207,122,.25)}
.card.done::before{background:var(--grn)}
.nm{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.name{font-weight:650;font-size:17px;line-height:1.3}
.badge{font-size:12px;font-weight:700;color:#06210f;background:var(--grn);padding:3px 9px;border-radius:99px;white-space:nowrap}
.badge.p{background:rgba(255,255,255,.08);color:var(--tx)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{font-size:12.5px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:#d8d4ce}
.tag.hl{color:var(--c);border-color:color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent);font-weight:600}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.dot{width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);font-weight:700;font-size:15px;display:grid;place-items:center;transition:transform .15s,background .2s,border-color .2s}
.dot:active{transform:scale(.92)}
.dot.on{background:var(--c);border-color:var(--c);color:#111;box-shadow:0 6px 18px color-mix(in srgb,var(--c) 45%,transparent);animation:pop .3s}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.run{height:50px;padding:0 22px;border-radius:15px;border:0;background:linear-gradient(135deg,var(--red),#a3141a);color:#fff;font-size:16px;font-weight:700;display:inline-flex;align-items:center;gap:9px;box-shadow:0 8px 22px rgba(232,40,46,.3)}
.run svg{width:16px;height:16px}
.tog{height:50px;padding:0 18px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-weight:650}
.tog.on{background:var(--grn);border-color:var(--grn);color:#06210f}
.wrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:10px 10px 10px 14px;border-radius:15px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
.wrow .pl{font-size:12px;color:var(--mut);letter-spacing:.04em}
.wrow .pl b{display:block;color:var(--gold);font-size:15px;letter-spacing:0;margin-top:2px}
.wrow label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.wrow input{width:78px;height:42px;border-radius:12px;border:1px solid rgba(217,185,127,.35);background:rgba(217,185,127,.06);color:var(--tx);font:700 19px var(--f);text-align:center;outline:none}
.wrow input:focus{border-color:var(--gold)}
.foot2{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.vid{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:#ffc9c9;text-decoration:none;padding:7px 11px 7px 8px;border-radius:99px;background:rgba(232,40,46,.12);border:1px solid rgba(232,40,46,.25)}
.vid i{width:20px;height:20px;border-radius:50%;background:var(--red);display:grid;place-items:center}
.vid i svg{width:9px;height:9px;fill:#fff;margin-left:1px}
.tip{margin-left:auto;font-size:12.5px;color:var(--mut);border:0;background:none;padding:6px 2px}
.cue{display:none;margin-top:10px;font-size:14px;line-height:1.55;color:#d6d2cc;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.035);border-left:2px solid var(--gold)}
.card.open .cue{display:block}
textarea{width:100%;min-height:84px;margin-top:12px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--tx);font:15px var(--f);padding:12px 14px;resize:vertical;outline:none}
.done-banner{margin:20px 0 0;padding:18px;border-radius:20px;text-align:center;background:linear-gradient(135deg,rgba(60,207,122,.18),rgba(217,185,127,.12));border:1px solid rgba(60,207,122,.3)}
.done-banner b{font-family:var(--d);font-size:30px;letter-spacing:.05em;display:block}
.done-banner span{color:var(--mut);font-size:13px}
.actions{display:flex;flex-direction:column;gap:10px;margin:28px 0 6px}
.btn{height:52px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:15.5px;font-weight:650}
.btn.pri{border:0;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1206}
.btn.ghost{background:transparent;color:var(--mut)}
.foot{color:var(--mut);font-size:12.5px;line-height:1.6;margin:14px 4px 0;text-align:center}
/* rest */
#rest{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:20;display:none;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:22px;background:rgba(24,24,27,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);box-shadow:0 14px 40px rgba(0,0,0,.6)}
#rest.show{display:flex;animation:up .25s}
@keyframes up{from{transform:translateY(20px);opacity:0}}
#rest .mini{position:relative;width:50px;height:50px;flex:none}
#rest .mini svg{transform:rotate(-90deg)}
#rest .rl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
#rest .rt{font-family:var(--d);font-size:34px;letter-spacing:.03em;line-height:1}
#rest .sp{flex:1}
#rest button{height:44px;padding:0 14px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-weight:650}
#rest.end .rt{color:var(--grn)}
/* overlay */
#ov{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 22px);--pc:#f5b301;background:radial-gradient(90% 60% at 50% 40%,color-mix(in srgb,var(--pc) 22%,transparent),transparent 70%),#08080a;transition:--pc .3s}
#ov.show{display:flex}
#ov[data-ph=work]{--pc:var(--red)}#ov[data-ph=rest]{--pc:var(--grn)}#ov[data-ph=done]{--pc:var(--gold)}
#ov .on{font-size:15px;font-weight:600;color:var(--mut);letter-spacing:.04em;text-align:center}
#ov .big{position:relative;width:min(78vw,360px);aspect-ratio:1;margin:auto 0 0}
#ov .big svg{width:100%;height:100%;transform:rotate(-90deg)}
#ov .big .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#ov .ph{font-size:15px;letter-spacing:.3em;font-weight:700;color:var(--pc)}
#ov .tm{font-family:var(--d);font-size:min(30vw,140px);line-height:.95;letter-spacing:.02em;margin-top:4px}
#ov .rn{font-size:14px;color:var(--mut);letter-spacing:.1em;margin-top:4px}
#ov .rds{display:flex;gap:6px;margin-top:22px}
#ov .rds i{width:22px;height:5px;border-radius:9px;background:rgba(255,255,255,.12)}
#ov .rds i.d{background:var(--pc)}
#ov .oc{max-width:520px;text-align:center;color:#cfcac3;font-size:14.5px;line-height:1.55;margin-top:18px}
#ov .ob{margin-top:auto;display:flex;gap:10px;width:100%;max-width:520px}
#ov .ob button{flex:1;height:58px;border-radius:18px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);font-size:16px;font-weight:700}
#ov .ob button.main{background:var(--pc);border-color:var(--pc);color:#111}
/* modal */
#md{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;padding:16px 12px calc(env(safe-area-inset-bottom) + 16px)}
#md.show{display:flex}
#md .bx{width:100%;max-width:520px;background:#161618;border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:20px}
#md h3{margin:0 0 8px;font-size:19px}
#md p{margin:0;color:var(--mut);font-size:15px;line-height:1.5}
#md .mb{display:flex;gap:10px;margin-top:16px}
#md .mb button{flex:1}
</style>
</head>
<body>
<div class="hero">
  <div class="eyebrow">İlk ay programı</div>
  <h1 class="title">BOKS <span>+</span> BACAK</h1>
  <div class="hrow">
    <div class="ring"><svg width="86" height="86" viewBox="0 0 86 86"><circle cx="43" cy="43" r="36" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="8"/><circle id="ringC" cx="43" cy="43" r="36" fill="none" stroke="url(#rg)" stroke-width="8" stroke-linecap="round" stroke-dasharray="226.2" stroke-dashoffset="226.2" style="transition:stroke-dashoffset .5s"/><defs><linearGradient id="rg"><stop offset="0" stop-color="#e8282e"/><stop offset="1" stop-color="#d9b97f"/></linearGradient></defs></svg><div class="v"><b id="pct">0%</b><small id="wk">HAFTA 1</small></div></div>
    <div class="next"><div class="k">Sıradaki</div><div class="n" id="nextN">İp atlama</div><div class="s" id="nextS"></div></div>
  </div>
  <div class="stats">
    <div class="stat"><b>~100</b><span>DAKİKA</span></div>
    <div class="stat"><b id="stRounds">0</b><span>BOKS ROUND</span></div>
    <div class="stat"><b id="stSets">0/0</b><span>SET</span></div>
  </div>
</div>
<nav><div class="weeks" id="weeks"></div></nav>
<main id="main"></main>

<div id="rest"><div class="mini"><svg width="50" height="50" viewBox="0 0 50 50"><circle cx="25" cy="25" r="21" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="5"/><circle id="rC" cx="25" cy="25" r="21" fill="none" stroke="#3ccf7a" stroke-width="5" stroke-linecap="round" stroke-dasharray="131.9" stroke-dashoffset="0"/></svg></div><div><div class="rl" id="rl">Dinlenme</div><div class="rt" id="rt">0:00</div></div><div class="sp"></div><button id="rAdd">+15</button><button id="rSkip">Atla</button></div>

<div id="ov" data-ph="prep">
  <div class="on" id="oN"></div>
  <div class="big"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="8"/><circle id="oRing" cx="100" cy="100" r="90" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-dasharray="565.5" stroke-dashoffset="565.5" style="color:var(--pc)"/></svg>
    <div class="in"><div class="ph" id="oP">HAZIRLAN</div><div class="tm" id="oT">0:05</div><div class="rn" id="oR"></div></div></div>
  <div class="rds" id="oDots"></div>
  <div class="oc" id="oC"></div>
  <div class="ob"><button id="oPause">Duraklat</button><button id="oSkip">Atla</button><button id="oClose">Kapat</button></div>
</div>

<div id="md"><div class="bx"><h3 id="mT"></h3><div id="mB"></div><div class="mb" id="mBtns"></div></div></div>

<script>
const YT=id=>'https://www.youtube.com/watch?v='+id;
const V={
 stance:['Duruş · Skye Nicolson',YT('OOysNE8Wrj8')],
 stance2:['Duruş hataları · Precision Striking',YT('x-yZ0ZPTJnE')],
 step:['Step-drag',YT('dHUutXudf8o')],
 fwdrill:['Footwork drili · T. Jeffries',YT('v0y86288Wt0')],
 jab:['Jab · T. Jeffries',YT('odM78vAS86M')],
 cross:['Cross · T. Jeffries',YT('sK-6Ujp3KYY')],
 onetwo:['1-2 · T. Jeffries',YT('vyTaKpylOcU')],
 def:['Slip, parry, blok',YT('VBtgzyG7kms')],
 parry:['Parry (ağır çekim)',YT('HL261oRyURE')],
 shadow:['Gölge boks · T. Jeffries',YT('i12A6G_LiJo')],
 med:['Rotasyonel atış',YT('PNI1QKiWfiY')],
 sj:['Squat jump iniş',YT('d0p-3x84nj0')],
 lb:['Lateral bound',YT('Rlf8hQ-Jzis')],
 pogo:['Pogo jump',YT('zKqcL6HSTE4')],
 lp:['Leg press · J. Nippard','https://www.youtube.com/shorts/nDh_BlnLCGc'],
 bss:['Bulgarian · Squat University',YT('-4LVK1crLSw')],
 ht:['Hip thrust · B. Contreras',YT('oeua30yIOF4')],
 calf:['Calf raise',YT('SVtg-1loH4c')],
 bext:['Back extension',YT('H8Swl1N-uis')],
 pallof:['Pallof press',YT('SY5lRzBPtM4')],
 mcgill:['McGill Big 3',YT('X_IGvnaPmQU')]
};

function plan(w){
 const early=w<2;
 const yum=[
  {name:'Jab',v:['jab'],r:4,cue:"Ön el düz uzanır, bitişte yumruk içe döner. Omuz çeneyi korur. Aynı yoldan hemen guard'a dön."},
  {name:'Jab + ayak',v:['jab','fwdrill'],r:4,cue:"İleri adımla jab, jab sonra geri çıkış. Yumruk adımla birlikte biter, ayak açılmaz."},
  {name:'Cross ve 1-2',v:['cross','onetwo'],r:5,cue:"Arka topuk döner, kalça ve gövde döner, kol en son gelir. Cross atarken ön el yanakta kalır."},
  {name:'1-2 + parry, slip',v:['onetwo','def','parry'],r:5,cue:"1-2 at. Gelen jab'i açık elle yana it (parry). Dizle ve gövdeyle başı çizgiden çıkar (slip). Hemen tekrar 1-2."}
 ][w];
 const shCue=["Sadece jab + footwork. Yavaş ve temiz, her şey guard'a dönsün.","Jab + hareket. Her jab'den sonra pozisyon değiştir.","1-2 + footwork. Her kombinasyondan sonra guard kontrolü.","1-2, slip, 1-2. Savunmadan sonra hemen karşılık ver."][w];
 return [
  {id:'isn',title:'Isınma',time:'8 dk',items:[
   {id:'ip',kind:'rounds',name:'İp atlama',rounds:1,work:300,rest:0,cue:'Hafif tempoda, ayak ucunda. İp yoksa yerinde hafif sekme.'},
   {id:'mob',kind:'rounds',name:'Mobilite: kol, kalça, gövde çevirme',rounds:1,work:180,rest:0,cue:'Omuz çevirme, kalça çevirme, gövde rotasyonu. Her biri ~1 dk.'}
  ]},
  {id:'pat',title:'Patlayıcı blok',time:'10 dk',note:'Bacaklar tazeyken. Her tekrar maksimum hız. Yorulursan seti bitir, kalite sayıdan önemli.',items:[
   {id:'med',kind:'sets',name:'Med Ball Rotational Wall Throw',sets:3,reps:'5 / yan',rest:60,load:early?'4 kg top':'5 kg top',v:['med'],cue:'Duvara yan dur. Kalçayla başlat, arka ayak döner, topu duvara maksimum hızla fırlat.'},
   {id:'sj',kind:'sets',name:'Squat Jump',sets:3,reps:'5',rest:60,load:'Vücut ağırlığı',v:['sj'],cue:'Hızlı in, patla. Dizi bükerek yumuşak ve sessiz in. Tekrarlar arası 1-2 sn reset.'},
   {id:'lb',kind:'sets',name:'Lateral Bound',sets:3,reps:'5 / yan',rest:60,load:'Vücut ağırlığı',v:['lb'],cue:'Tek ayaktan yana sıçra, karşı ayağa in, 1 sn sabitle.'},
   {id:'pogo',kind:'sets',name:'Pogo Hop',sets:2,reps:'20 sn',rest:45,load:'Vücut ağırlığı',v:['pogo'],cue:'Dizler neredeyse düz, ayak ucunda hızlı ve alçak zıplamalar.'}
  ]},
  {id:'boks',title:'Boks',time:'~42 dk',note:w===1?'Bu haftanın sonunda bir antrenöre formuna baktır.':'Her hafta tek konu. Kendini yandan çekip videoyla karşılaştır.',items:[
   {id:'stance',kind:'rounds',name:'Stance + guard',rounds:[4,2,2,2][w],work:90,rest:30,v:['stance','stance2'],cue:'Ayna önünde. Sağ elliysen sol ayak önde, ayaklar omuz genişliği. Dizler hafif bükük, topuk hafif havada. Eller yanakta, dirsekler gövdede, çene aşağı.'},
   {id:'fw',kind:'rounds',name:'Footwork: step and drag',rounds:[5,4,3,3][w],work:w===0?90:120,rest:30,v:['step','fwdrill'],cue:'Gideceğin yöndeki ayak önce gider, diğeri sürünür. Ayaklar asla çaprazlanmaz, genişlik sabit kalır.'},
   {id:'yum',kind:'rounds',name:yum.name,rounds:yum.r,work:120,rest:30,v:yum.v,cue:yum.cue},
   {id:'sh',kind:'rounds',name:'Gölge boks',rounds:[3,3,3,4][w],work:120,rest:60,v:['shadow'],cue:shCue}
  ]},
  {id:'kuv',title:'Kuvvet bloğu',time:'25-30 dk',note:"Her sette 2 RiR bırak, 0'a gitme. Tüm setler 2 RiR ile bittiyse ertesi hafta artır, bitmediyse aynı kalsın.",items:[
   {id:'lp',kind:'sets',name:'Leg Press',sets:3,reps:'10',rest:90,wt:[80,85,90,95],unit:'kg',v:['lp'],cue:'Ayaklar platformun ortasında, omuz genişliğinde. Bel koltuktan kalkmasın. Dizleri tam kilitleme.'},
   {id:'bss',kind:'sets',name:'Bulgarian Split Squat',sets:2,reps:'8 / bacak',rest:90,wt:[10,10,12,12],unit:'kg × 2',v:['bss'],cue:'Arka ayak bankta. Gövde hafif öne, ön dizle kontrollü in. Zayıf bacakla başla.'},
   {id:'ht',kind:'sets',name:'Barbell Hip Thrust',sets:3,reps:'8',rest:90,wt:[40,42.5,45,47.5],unit:'kg',v:['ht'],cue:'Sırtın üstü bankta, çene göğse yakın, kaburgalar aşağı. Tepede 1 sn kalçayı sık. Belle değil kalçayla kaldır.'},
   {id:'calf',kind:'sets',name:'Standing Calf Raise',sets:2,reps:'15',rest:60,wt:[15,15,17.5,17.5],unit:'kg × 2',v:['calf'],cue:'Tam aşağı in, tepede 1 sn bekle. Sekme yok.'},
   {id:'bext',kind:'sets',name:'45° Back Extension',sets:2,reps:'12',rest:60,wt:[0,0,0,5],unit:'kg plaka',v:['bext'],cue:'2 sn çık, 3 sn in. Hareket kalçadan, bel sabit. Tepede vücut düz bir çizgi olsun, aşırı kavisleme.'},
   {id:'pallof',kind:'sets',name:'Pallof Press',sets:2,reps:'10 / yan',rest:45,wt:[10,10,12.5,12.5],unit:'kg',v:['pallof'],cue:'Kabloya yan dur, kolları göğüsten düz it, 2 sn tut. Gövde dönmesin.'},
   {id:'bird',kind:'sets',name:'Bird Dog',sets:2,reps:'8 / yan',rest:45,load:'Vücut ağırlığı',v:['mcgill'],cue:'Karşı kol ve bacağı uzat, uçta 2 sn bekle. Bel düz, kalça dönmesin.'},
   {id:'sp',kind:'sets',name:'Side Plank',sets:2,reps:[30,35,40,45][w]+' sn / yan',rest:45,load:'Vücut ağırlığı',v:['mcgill'],cue:'Dirsek omuzun altında, vücut tek çizgi, kalça düşmesin.'}
  ]},
  {id:'esn',title:'Esneme',time:'5 dk',items:[
   {id:'esn',kind:'rounds',name:'Esneme: kalça, baldır, omuz',rounds:1,work:300,rest:0,cue:'Her bölge 30-45 sn, zorlamadan.'}
  ]}
 ];
}


const SEC={
 isn:{c:'#ff8a3d',i:'<path d="M12 2c2 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-3 0-5 1-8z"/>'},
 pat:{c:'#f5c518',i:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>'},
 boks:{c:'#e8282e',i:'<path d="M7 11V8a5 5 0 0 1 10 0v5a3 3 0 0 1-3 3H9.5A2.5 2.5 0 0 1 7 13.5"/><path d="M7 11a2 2 0 0 0-2 2 2 2 0 0 0 2 2"/><path d="M9 16v5h7v-5"/><path d="M9 18.5h7"/>'},
 kuv:{c:'#d9b97f',i:'<path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/>'},
 esn:{c:'#4fd1c5',i:'<path d="M5 19C5 9 11 4 20 4c0 9-5 15-15 15z"/><path d="M5 19l8-8"/>'}
};
const KEY='boks-bacak-v1';
let S={week:0,done:{},wt:{},notes:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>s%60===0?(s/60)+' dk':s+' sn';
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const svg=(p,sw)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const PLAY='<svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg>';
let ITEMS={};
function itemDone(w,it){const k=w+':'+it.id;return it.kind==='sets'?[Math.min((S.done[k]||[]).filter(Boolean).length,it.sets),it.sets]:[S.done[k]?1:0,1];}
function weekPct(w){let t=0,d=0;plan(w).forEach(s=>s.items.forEach(it=>{const[a,b]=itemDone(w,it);d+=a;t+=b;}));return t?Math.round(100*d/t):0;}

function render(){
 const w=S.week,P=plan(w);ITEMS={};
 $('weeks').innerHTML=[0,1,2,3].map(i=>`<button class="${i===w?'on':''}" data-w="${i}">HAFTA ${i+1}${weekPct(i)===100?'<i></i>':''}</button>`).join('');
 let h='',next=null,rd=0,rt=0,sd=0,st=0;
 P.forEach((sec,si)=>{
  const M=SEC[sec.id];let sdn=0,stt=0;
  let body='';
  sec.items.forEach(it=>{
   const k=w+':'+it.id;ITEMS[k]=it;
   const[a,b]=itemDone(w,it);sdn+=a;stt+=b;
   if(sec.id==='boks'){rt+=it.rounds;if(S.done[k])rd+=it.rounds;}
   if(it.kind==='sets'){st+=it.sets;sd+=a;}
   const done=a>=b;
   if(!done&&!next)next={it,sec};
   let tags='',ctr='';
   if(it.kind==='sets'){
    tags=`<span class="tag hl">${it.sets} × ${esc(it.reps)}</span><span class="tag">${it.rest} sn dinlenme</span>`+(it.load?`<span class="tag">${esc(it.load)}</span>`:'');
    const arr=S.done[k]||[];
    ctr=`<div class="chips">`+Array.from({length:it.sets},(_,i)=>`<button class="dot ${arr[i]?'on':''}" data-act="set" data-k="${k}" data-i="${i}">${arr[i]?'✓':i+1}</button>`).join('')+`</div>`;
    if(it.wt){const pv=it.wt[w];const ptxt=pv===0?'Vücut ağırlığı':pv+' '+it.unit;const val=S.wt[k]!==undefined?S.wt[k]:(pv===0?'':pv);
     ctr+=`<div class="wrow"><span class="pl">PLAN<b>${esc(ptxt)}</b></span><label>Bugün <input inputmode="decimal" data-k="${k}" value="${esc(val)}" placeholder="VA"> ${esc(it.unit.replace(' plaka',''))}</label></div>`;}
   }else{
    tags=it.rounds>1?`<span class="tag hl">${it.rounds} round × ${fmt(it.work)}</span><span class="tag">${it.rest} sn ara</span>`:`<span class="tag hl">${fmt(it.work)}</span>`;
    ctr=`<div class="chips"><button class="run" data-act="run" data-k="${k}">${svg('<path d="M7 4l13 8-13 8z" fill="currentColor"/>')}Başlat</button><button class="tog ${S.done[k]?'on':''}" data-act="tog" data-k="${k}">${S.done[k]?'✓ Tamam':'Tamam'}</button></div>`;
   }
   const vids=(it.v||[]).map(x=>`<a class="vid" href="${V[x][1]}" target="_blank" rel="noopener"><i>${PLAY}</i>${esc(V[x][0])}</a>`).join('');
   const badge=it.kind==='sets'&&a>0&&!done?`<span class="badge p">${a}/${b}</span>`:done?`<span class="badge">✓</span>`:'';
   body+=`<div class="card ${done?'done':''}" style="--c:${M.c}"><div class="nm"><div class="name">${esc(it.name)}</div>${badge}</div><div class="tags">${tags}</div>${ctr}<div class="foot2">${vids}<button class="tip" data-act="tip">Form ipucu ›</button></div><div class="cue">${esc(it.cue)}</div></div>`;
  });
  h+=`<section class="sec" style="--c:${M.c}"><div class="sh"><div class="ic">${svg(M.i)}</div><div class="t"><div class="num">0${si+1}</div><h2>${sec.title.toUpperCase()}</h2></div><div class="tm"><b>${sec.time}</b>${sdn}/${stt}</div></div><div class="sbar"><i style="width:${stt?100*sdn/stt:0}%"></i></div>${sec.note?`<p class="note">${esc(sec.note)}</p>`:''}${body}`;
  if(sec.id==='kuv')h+=`<textarea data-note="1" placeholder="Not: hangi sette zorlandın, RiR, ağrı var mı…">${esc((S.notes||{})[w]||'')}</textarea>`;
  h+=`</section>`;
 });
 const p=weekPct(w);
 if(p===100)h+=`<div class="done-banner"><b>SEANS TAMAM</b><span>Haftanın özetini kopyalayıp bana gönder.</span></div>`;
 h+=`<div class="actions"><button class="btn pri" data-act="copy">Haftanın özetini kopyala</button><button class="btn ghost" data-act="reset">Bu haftayı sıfırla</button></div><p class="foot">Ev drili: gölge boks 10 dk, haftada 2-3 kez · Zil için sessiz modu kapat</p>`;
 $('main').innerHTML=h;
 $('pct').textContent=p+'%';$('wk').textContent='HAFTA '+(w+1);
 $('ringC').style.strokeDashoffset=226.2*(1-p/100);
 $('stRounds').textContent=rd+'/'+rt;$('stSets').textContent=sd+'/'+st;
 if(next){$('nextN').textContent=next.it.name;$('nextS').textContent=next.sec.title+' · '+(next.it.kind==='sets'?next.it.sets+' × '+next.it.reps:(next.it.rounds>1?next.it.rounds+' × '+fmt(next.it.work):fmt(next.it.work)));}
 else{$('nextN').textContent='Hepsi bitti 🥊';$('nextS').textContent='Harika iş';}
}

/* audio */
let AC=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(f,d,v){if(!AC)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f||880;g.gain.setValueAtTime(v||.25,t);g.gain.exponentialRampToValueAtTime(.0001,t+(d||.15));o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+(d||.15)+.03);}catch(e){}}
function bell(){beep(660,.45,.35);setTimeout(()=>beep(990,.6,.35),170);}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
let WL=null;
async function wake(){try{if('wakeLock' in navigator)WL=await navigator.wakeLock.request('screen');}catch(e){}}
function unwake(){try{WL&&WL.release();}catch(e){}WL=null;}

/* rest */
let R=null;
function startRest(sec){stopRest();if(!sec)return;R={end:Date.now()+sec*1000,total:sec,last:-1};$('rest').classList.add('show');$('rest').classList.remove('end');$('rl').textContent='Dinlenme';R.iv=setInterval(tickRest,200);tickRest();}
function tickRest(){if(!R)return;const left=Math.max(0,Math.ceil((R.end-Date.now())/1000));if(left===R.last)return;R.last=left;$('rt').textContent=mmss(left);$('rC').style.strokeDashoffset=131.9*(1-left/R.total);
 if(left<=3&&left>0)beep(880,.12);
 if(left===0){clearInterval(R.iv);bell();buzz([200,100,200]);$('rl').textContent='Sonraki set';$('rest').classList.add('end');const me=R;setTimeout(()=>{if(R===me)stopRest();},5000);}}
function stopRest(){if(R){clearInterval(R.iv);R=null;}$('rest').classList.remove('show','end');}
$('rAdd').onclick=()=>{ac();if(!R)return;if(R.last===0){startRest(15);return;}R.end+=15000;R.total+=15;};
$('rSkip').onclick=stopRest;

/* rounds */
let T=null;
const PH={prep:'HAZIRLAN',work:'ÇALIŞ',rest:'DİNLEN'};
function runRounds(k){
 const it=ITEMS[k];stopRest();
 const ph=[{t:'prep',d:5}];
 for(let r=1;r<=it.rounds;r++){ph.push({t:'work',d:it.work,r});if(r<it.rounds&&it.rest)ph.push({t:'rest',d:it.rest,r:r+1});}
 T={k,it,ph,i:0,end:Date.now()+5000,paused:false,rem:0,last:-1};
 $('oN').textContent=it.name.toUpperCase();$('oC').textContent=it.cue;$('oPause').textContent='Duraklat';
 $('oPause').style.display='';$('oSkip').style.display='';
 $('oDots').innerHTML=it.rounds>1?Array.from({length:it.rounds},()=>'<i></i>').join(''):'';
 $('ov').classList.add('show');wake();
 T.iv=setInterval(tickT,200);tickT();
}
function tickT(){if(!T||T.paused)return;const p=T.ph[T.i];const ms=Math.max(0,T.end-Date.now());const left=Math.ceil(ms/1000);
 $('oRing').style.strokeDashoffset=565.5*(1-ms/(p.d*1000));
 if(left!==T.last){T.last=left;$('ov').dataset.ph=p.t;$('oP').textContent=PH[p.t];$('oT').textContent=mmss(left);
  $('oR').textContent=T.it.rounds>1?`ROUND ${p.r||1} / ${T.it.rounds}`:'';
  const doneR=T.ph.slice(0,T.i).filter(x=>x.t==='work').length;[...$('oDots').children].forEach((d,i)=>d.classList.toggle('d',i<doneR||(i===doneR&&p.t==='work')));
  if(left<=3&&left>0)beep(p.t==='work'?700:880,.12);}
 if(Date.now()>=T.end)nextPh();}
function nextPh(){T.i++;if(T.i>=T.ph.length){finishT();return;}const p=T.ph[T.i];T.end=Date.now()+p.d*1000;T.last=-1;
 if(p.t==='work'){bell();buzz(300);}else{beep(520,.4,.3);buzz([100,80,100]);}tickT();}
function finishT(){clearInterval(T.iv);S.done[T.k]=true;save();bell();setTimeout(bell,700);buzz([300,100,300]);
 $('ov').dataset.ph='done';$('oP').textContent='BİTTİ';$('oT').textContent='✓';$('oR').textContent='';$('oRing').style.strokeDashoffset=0;
 [...$('oDots').children].forEach(d=>d.classList.add('d'));
 $('oPause').style.display='none';$('oSkip').style.display='none';render();}
$('oPause').onclick=()=>{ac();if(!T)return;if(!T.paused){T.rem=T.end-Date.now();T.paused=true;$('oPause').textContent='Devam';}else{T.end=Date.now()+T.rem;T.paused=false;$('oPause').textContent='Duraklat';}};
$('oSkip').onclick=()=>{if(!T||T.i>=T.ph.length)return;if(T.paused){T.paused=false;$('oPause').textContent='Duraklat';}nextPh();};
$('oClose').onclick=()=>{if(T){clearInterval(T.iv);T=null;}$('ov').classList.remove('show');unwake();};

function modal(title,html,btns){$('mT').textContent=title;$('mB').innerHTML=html;$('mBtns').innerHTML='';
 btns.forEach(b=>{const e=document.createElement('button');e.className='btn'+(b.pri?' pri':'');e.textContent=b.t;e.onclick=()=>{$('md').classList.remove('show');b.f&&b.f();};$('mBtns').appendChild(e);});
 $('md').classList.add('show');}
function summary(){
 const w=S.week,P=plan(w),L=[`Hafta ${w+1} özeti`];
 P.forEach(sec=>{
  if(sec.id==='kuv'){L.push('Kuvvet bloğu:');sec.items.forEach(it=>{const k=w+':'+it.id;const c=itemDone(w,it)[0];
   let load='';if(it.wt){const pv=it.wt[w];const v=S.wt[k]!==undefined&&S.wt[k]!==''?S.wt[k]:(pv===0?'VA':pv);load=(v==='VA'?'VA':v+' '+it.unit);}else load=it.load||'';
   L.push(`- ${it.name}: ${it.sets}×${it.reps}, ${load}, ${c}/${it.sets} set`);});}
  else if(sec.id==='boks'||sec.id==='pat'){let t=0,d=0;sec.items.forEach(it=>{const[a,b]=itemDone(w,it);d+=a;t+=b;});L.push(`${sec.title}: ${d}/${t} tamam`);}
 });
 const n=(S.notes||{})[w];if(n)L.push('Not: '+n);
 return L.join('\n');
}
document.addEventListener('click',e=>{
 const wb=e.target.closest('[data-w]');
 if(wb){S.week=+wb.dataset.w;save();render();window.scrollTo({top:0,behavior:'smooth'});return;}
 const b=e.target.closest('[data-act]');if(!b)return;ac();
 const k=b.dataset.k,act=b.dataset.act;
 if(act==='tip'){const c=b.closest('.card');c.classList.toggle('open');b.textContent=c.classList.contains('open')?'Gizle ‹':'Form ipucu ›';return;}
 if(act==='set'){const it=ITEMS[k];const a=S.done[k]||[];const i=+b.dataset.i;a[i]=!a[i];S.done[k]=a;save();render();if(a[i])startRest(it.rest);else stopRest();}
 else if(act==='tog'){S.done[k]=!S.done[k];save();render();}
 else if(act==='run'){runRounds(k);}
 else if(act==='copy'){const txt=summary();
  const fallback=()=>{modal('Özeti kopyala','<p>Metni seçip kopyala, sonra bana gönder.</p><textarea id="sumTa" style="min-height:200px">'+esc(txt)+'</textarea>',[{t:'Kapat',pri:true}]);const ta=$('sumTa');if(ta){ta.focus();ta.select();}};
  try{navigator.clipboard.writeText(txt).then(()=>modal('Kopyalandı','<p>Haftanın özeti panoda. Bana yapıştır, sonraki haftanın ağırlıklarını ayarlarım.</p>',[{t:'Tamam',pri:true}])).catch(fallback);}catch(err){fallback();}}
 else if(act==='reset'){const w=S.week;modal(`Hafta ${w+1} sıfırlansın mı?`,'<p>Bu haftanın işaretleri, ağırlıkları ve notu silinir.</p>',[{t:'Vazgeç'},{t:'Sıfırla',pri:true,f:()=>{Object.keys(S.done).forEach(x=>{if(x.startsWith(w+':'))delete S.done[x];});Object.keys(S.wt).forEach(x=>{if(x.startsWith(w+':'))delete S.wt[x];});if(S.notes)delete S.notes[w];save();render();}}]);}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.matches('input[data-k]')){S.wt[t.dataset.k]=t.value.replace(',','.');save();}
 else if(t.matches('textarea[data-note]')){S.notes=S.notes||{};S.notes[S.week]=t.value;save();}
});
$('md').addEventListener('click',e=>{if(e.target===$('md'))$('md').classList.remove('show');});
render();
</script>
</body>
